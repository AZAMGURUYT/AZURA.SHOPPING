<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azura Luxury | Animated Glow Edition</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #050505; color: #ffffff; overflow-x: hidden; scroll-behavior: smooth; }

        /* Navigation Glassmorphism */
        nav { 
            padding: 20px 5%; display: flex; justify-content: space-between; align-items: center; 
            position: fixed; width: 100%; z-index: 1000; 
            background: rgba(5, 5, 5, 0.8); backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .logo { font-weight: 600; font-size: 1.5rem; letter-spacing: 5px; color: #fff; }

        /* Hero Section */
        .hero { 
            height: 100vh; display: flex; flex-direction: column; justify-content: center; 
            align-items: center; text-align: center; 
            background: radial-gradient(circle at center, #111 0%, #050505 100%);
        }
        .hero h1 { font-size: clamp(3rem, 12vw, 6.5rem); font-weight: 600; letter-spacing: -2px; }

        /* Rotating Glow Border Container */
        .glow-box {
            position: relative;
            width: fit-content;
            margin: auto;
            padding: 5px;
            background: linear-gradient(0deg, transparent, transparent, #25d366, #25d366);
            border-radius: 20px;
            overflow: hidden;
            animation: rotateBorder 4s linear infinite;
        }

        .glow-box::before {
            content: '';
            position: absolute;
            inset: -5px;
            background: linear-gradient(0deg, transparent, transparent, #25d366, #25d366);
            animation: rotateBorder 4s linear infinite;
        }

        @keyframes rotateBorder {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Inner Image Styling */
        .product-image-inner {
            background: #050505;
            padding: 10px;
            border-radius: 15px;
            position: relative;
            z-index: 1;
        }

        .product-image img { 
            width: 100%; max-width: 400px; 
            filter: drop-shadow(0 0 20px rgba(37, 211, 102, 0.4));
            border-radius: 15px;
            transition: 0.5s ease;
        }

        /* Continuous Float for the whole box */
        .float-container {
            animation: floatAnim 4s ease-in-out infinite;
        }

        @keyframes floatAnim {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        /* Product Section */
        .product-section { padding: 120px 5%; }
        .product-container { 
            display: flex; align-items: center; justify-content: space-around; 
            max-width: 1300px; margin: 0 auto 180px auto; gap: 60px;
        }
        
        .product-info { flex: 1; padding: 20px; }
        .product-info h2 { font-size: clamp(2.5rem, 6vw, 3.5rem); margin-bottom: 25px; }
        .product-info p { font-size: 1.1rem; color: #888; margin-bottom: 35px; line-height: 1.8; }

        /* Luxury Button */
        .buy-btn { 
            display: inline-flex; align-items: center; padding: 18px 40px; 
            background: transparent; color: #fff; text-decoration: none; 
            border: 2px solid #25d366; border-radius: 5px; font-weight: 600;
            transition: 0.4s; text-transform: uppercase; letter-spacing: 2px;
        }
        .buy-btn:hover { background: #25d366; color: #000; box-shadow: 0 0 30px rgba(37, 211, 102, 0.5); }

        /* Floating WhatsApp */
        .whatsapp-float {
            position: fixed; bottom: 40px; right: 40px; background: #25d366; color: white;
            width: 70px; height: 70px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-size: 35px; z-index: 1000;
            box-shadow: 0 0 20px rgba(37, 211, 102, 0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 20px rgba(37, 211, 102, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
        }

        @media (max-width: 768px) {
            .product-container { flex-direction: column !important; text-align: center; }
            .hero h1 { font-size: 3.5rem; }
            .product-image img { max-width: 300px; }
            .buy-btn { width: 100%; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">AZURA.</div>
        <div style="font-size: 0.8rem; letter-spacing: 2px;">PREMIUM STORE</div>
    </nav>

    <section class="hero">
        <h1 data-aos="zoom-in" data-aos-duration="1500">AZURA <br> EXCLUSIVE</h1>
        <p data-aos="fade-up" data-aos-delay="400">Where Premium meets Perfection.</p>
    </section>

    <section class="product-section">
        
        <div class="product-container">
            <div class="float-container" data-aos="fade-right" data-aos-duration="1200" data-aos-mirror="true">
                <div class="glow-box">
                    <div class="product-image-inner">
                        <img src="bag front .png" alt="XCLENT BAG">
                    </div>
                </div>
            </div>
            <div class="product-info" data-aos="fade-left" data-aos-duration="1200" data-aos-mirror="true">
                <h2>The XCLENT</h2>
                <p>Designed for excellence. A masterpiece of durability and luxury style.</p>
                <a href="https://wa.me/919560635855?text=I%20want%20to%20order%20The%20XCLENT%20BAG" class="buy-btn" target="_blank">
                    <i class="fab fa-whatsapp"></i> ORDER NOW
                </a>
            </div>
        </div>

        <div class="product-container" style="flex-direction: row-reverse;"> 
            <div class="float-container" data-aos="fade-left" data-aos-duration="1200" data-aos-mirror="true">
                <div class="glow-box">
                    <div class="product-image-inner">
                        <img src="GREY FRNT.png" alt="Smart Grey Bag">
                    </div>
                </div>
            </div>
            <div class="product-info" data-aos="fade-right" data-aos-duration="1200" data-aos-mirror="true">
                <h2>Urban Grey</h2>
                <p>Minimalist design for the modern lifestyle. Effortless style in every move.</p>
                <a href="https://wa.me/919560635855?text=I%20want%20to%20order%20the%20Smart%20GREY%20Carry%20Bag" class="buy-btn" target="_blank">
                    <i class="fab fa-whatsapp"></i> ORDER NOW
                </a>
            </div>
        </div>

    </section>

    <a href="https://wa.me/919560635855" class="whatsapp-float" target="_blank">
        <i class="fab fa-whatsapp"></i>
    </a>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({
            duration: 1000,
            once: false, // Animation baar-baar hogi
            mirror: true, // Up/Down scroll dono par chalega
            offset: 100
        });
    </script>
</body>
</html>
